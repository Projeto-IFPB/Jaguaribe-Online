{% extends "base.html" %}

{% block title %} pagina Inicial {% endblock %}

{% block.css %} <link rel="stylesheet" href="formulario2.css"> {% endblock %}

{% block content %}


    <div class="container">
        <h1>Cadastro de Produto</h1>

        <form action="#" method="post" enctype="multipart/form-data">

            <div class="campo">
                <label for="vendedor">Nome do Vendedor</label>
                <input type="text" id="vendedor" name="vendedor" placeholder="nome do vendedor" required>
            </div>

            <div class="campo">
                <label for="nome">Nome do Produto</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: morango" required>
            </div>

            <div class="campo">
                <label for="preco">Preço (R$)</label>
                <input type="number" id="preco" name="preco" placeholder="0,00" step="0.01" min="0" required>
            </div>

            <div class="campo">
                <label for="foto">Foto do Produto</label>
                <input type="file" id="foto" name="foto" accept="image/*">
            </div>

            <div class="campo">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" rows="5" placeholder="Detalhes do produto..."></textarea>
            </div>

            <button type="submit">Cadastrar Produto</button>
        </form>
    </div>

{% endblock %}
