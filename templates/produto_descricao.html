{% extends "base.html" %}

{% block title %}Detalhes do Produto{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/produto_descricao.css') }}">
{% endblock %}

{% block content %}
<main class="produto-detalhe">
    <h1>Nome do Produto</h1>

    <section>
      <div class="descricao">
        <p><strong>Preço:</strong> R$ 0,00</p>
        <p><strong>Vendedor:</strong> Nome do vendedor</p>
        <h2>Descrição</h2>
        <p>Descrição completa do produto.</p>
        <a href="{{ url_for('pagina_produtos') }}">Voltar</a>
      </div>
    </section>
</main>
{% endblock %}
